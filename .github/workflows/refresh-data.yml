name: Refresh Torvik ratings

on:
  workflow_dispatch:
    inputs:
      year:
        description: Season end year (2026 snapshot available; newer years need source URL)
        required: true
        default: '2026'
        type: string
      source_url:
        description: Optional URL for a verified newer CSV source
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Download and process Torvik ratings
        env:
          DATA_YEAR: ${{ inputs.year || '2026' }}
          CSV_SOURCE_URL: ${{ inputs.source_url || '' }}
        run: |
          if [ -n "$CSV_SOURCE_URL" ]; then
            python scripts/fetch_data.py --year "$DATA_YEAR" --source-url "$CSV_SOURCE_URL"
          else
            python scripts/fetch_data.py --year "$DATA_YEAR"
          fi
      - name: Commit refreshed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/teams.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: refresh Torvik ratings"
            git push
          fi
